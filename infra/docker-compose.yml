services:
  postgres:
    image: postgres:16
    container_name: part9-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: senior_rag_quiz_lab
    ports:
      - "5432:5432"
    volumes:
      - part9_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d senior_rag_quiz_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: part9-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - part9_qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    container_name: part9-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: part9-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragadmin
      MINIO_ROOT_PASSWORD: ragpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - part9_minio_data:/data

volumes:
  part9_postgres_data:
  part9_qdrant_data:
  part9_minio_data: