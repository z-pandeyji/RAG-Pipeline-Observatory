[project]
name = "senior-rag-quiz-lab"
version = "0.1.0"
description = "Local-first PDF RAG quiz generator using LM Studio"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.4.0",
  "pymupdf>=1.24.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.30.0",
  "youtube-transcript-api>=0.6.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]
youtube = [
  "yt-dlp>=2025.1.15",
  "faster-whisper>=1.1.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "apps*"]

[tool.setuptools.package-data]
app = ["storage/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
